name: Auto-update from immich-build

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la mise à jour même si la version locale est à jour"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  BUILD_REPO: YunoHost-Apps/immich-build
  BASE_BRANCH: testing

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing
        uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Récupérer le manifest.json de la dernière release amont
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag=$(gh release list --repo "$BUILD_REPO" --limit 30 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '[.[] | select(.isDraft==false and .isPrerelease==false)][0].tagName')
          [ -n "$tag" ] || { echo "Aucune release exploitable sur $BUILD_REPO"; exit 1; }
          echo "Tag amont : $tag"

          version="${tag#immich-v}"
          gh release download "$tag" --repo "$BUILD_REPO" \
            --pattern "immich-v${version}-manifest.json" \
            --output upstream-manifest.json --clobber

          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Comparer les versions et éditer manifest.toml
        id: edit
        run: |
          python3 .github/workflows/autoupdate_from_build.py \
            --upstream-manifest upstream-manifest.json \
            --manifest manifest.toml \
            --new-version "${{ steps.upstream.outputs.version }}" \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit sur la branche autoupdate-{version}
        if: steps.edit.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          rm -f upstream-manifest.json
          branch="autoupdate-${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1
          then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi

          git add manifest.toml
          if git diff --cached --quiet
          then
            echo "Aucun changement à committer."
            exit 0
          fi
          git commit -m "Upgrade to v${VERSION} (sources from immich-build)"
          git push --set-upstream origin "$branch"

      - name: Créer la Pull Request
        if: steps.edit.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.upstream.outputs.version }}
          OLD_VERSION: ${{ steps.edit.outputs.old_version }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          branch="autoupdate-${VERSION}"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]
          then
            echo "PR déjà ouverte pour $branch."
            exit 0
          fi
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Upgrade to v${VERSION}" \
            --body "Mise à jour automatique ${OLD_VERSION} → ${VERSION}.

          Source → https://github.com/${BUILD_REPO}/releases/tag/${TAG}

          - \`version\` → \`${VERSION}~ynh1\`
          - \`resources.nodejs.version\`
          - urls et sha256 \`immich_prebuilt_bookworm\` / \`immich_prebuilt_trixie\` (amd64 + arm64)"
